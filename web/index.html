<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Wanderer: see the SPHEREx infrared sky move. Blink, compare and track asteroids, comets and fast stars in real SPHEREx images." />
    <link rel="preconnect" href="https://irsa.ipac.caltech.edu" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Wanderer</title>
    <script>
      try {
        var t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('wanderer.theme');
        document.documentElement.style.background = t === 'light' ? '#f6f5f2' : '#0b0d10';
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
