# Continuous integration: every push and pull request must pass before the
# server's deploy poller (deploy/poll-deploy.sh) will roll it out.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: Go gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: gateway/go.sum
      - run: go vet ./...
      - run: go test -p 1 ./...
      - run: CGO_ENABLED=0 go build -o /tmp/gateway .

  science:
    name: Python science service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: science
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: science/requirements.txt
      - run: pip install -r requirements.txt
      - name: Import check
        run: python -c "import app; print('routes:', len(app.app.routes))"

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Every control explains itself (focus mode)
        run: npm run check:explain
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [gateway, science, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
